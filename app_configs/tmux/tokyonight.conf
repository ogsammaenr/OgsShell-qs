# === Minimal Tmux Theme (TOKYO NIGHT) ===
set -g @minimal-tmux-fg "#1A1B26"
set -g @minimal-tmux-bg "#7AA2F7"
set -g @minimal-tmux-justify "absolute-centre"
set -g @minimal-tmux-right true
set -g @minimal-tmux-left true
set -g @minimal-tmux-expanded-icon "󰊓 "
set -g @minimal-tmux-show-expanded-icon-for-all-tabs true

set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""
set -g @minimal-tmux-indicator false

set -g @minimal-tmux-status-left-extra "#{?client_prefix,#[fg=#F7768E]#[bg=#F7768E]#[fg=#1A1B26]#[bold] tmux #[default]#[fg=#F7768E],#[fg=#7AA2F7]#[bg=#7AA2F7]#[fg=#1A1B26]#[bold] tmux #[default]#[fg=#7AA2F7]} "
set -g @minimal-tmux-status-right-extra " #{cpu_percentage}   #{ram_percentage}  󰘬 #(git -C #{pane_current_path} branch --show-current 2>/dev/null) "

set -g status-right-length 150
set -g status-left-length 150
