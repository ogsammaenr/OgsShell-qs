<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Pure Zen Dark Obsidian Wallpaper -->
    <radialGradient id="zenBg" cx="50%" cy="44%" r="65%">
      <stop offset="0%" stop-color="#1d2028"/>
      <stop offset="48%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>

    <radialGradient id="ringAura" cx="50%" cy="44%" r="24%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="progressArc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#a8adb8" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="zenInput" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#f0f0f0" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="zenShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.58"/>
    </filter>

    <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Pure Zen Atmospheric Backdrop -->
  <rect width="1920" height="1080" fill="url(#zenBg)"/>
  <rect width="1920" height="1080" fill="url(#ringAura)"/>

  <!-- Ultra-Subtle Concentric Hairline Ripples -->
  <circle cx="960" cy="442" r="290" fill="none" stroke="#f0f0f0" stroke-opacity="0.025" stroke-width="1"/>
  <circle cx="960" cy="442" r="395" fill="none" stroke="#f0f0f0" stroke-opacity="0.018" stroke-width="1"/>

  <!-- 2. Minimal Top Dynamic Notch (Pure OLED Black #000000) -->
  <g filter="url(#zenShadow)">
    <path d="M 862 0
             C 867 0, 870 6, 870 14
             L 870 16
             A 16 16 0 0 0 886 32
             L 1034 32
             A 16 16 0 0 0 1050 16
             L 1050 14
             C 1050 6, 1053 0, 1058 0
             Z"
          fill="#000000"/>
    <path d="M 870.5 16 A 15.5 15.5 0 0 0 886 31.5 L 1034 31.5 A 15.5 15.5 0 0 0 1049.5 16"
          fill="none" stroke="#f0f0f0" stroke-opacity="0.08" stroke-width="1"/>
  </g>
  <!-- Top Notch Micro-Icons -->
  <g transform="translate(894, 9)">
    <g stroke="#f0f0f0" stroke-width="1.4" fill="none" opacity="0.88">
      <rect x="2" y="6.5" width="9" height="6.8" rx="1.8"/>
      <path d="M 4.3 6.5 V 4.5 A 2.2 2.2 0 0 1 8.7 4.5 V 6.5"/>
    </g>
    <g transform="translate(30, 1)" stroke="#f0f0f0" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.78">
      <path d="M 1 4.2 A 8.5 8.5 0 0 1 13 4.2"/>
      <path d="M 3.5 6.9 A 5 5 0 0 1 10.5 6.9"/>
      <circle cx="7" cy="9.9" r="1" fill="#f0f0f0" stroke="none"/>
    </g>
    <g transform="translate(60, 1.5)" stroke="#f0f0f0" stroke-width="1.25" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <path d="M 4 1 L 4 11.5 L 7.8 8.7 L 1.2 3.7 M 1.2 8.7 L 7.8 3.7 L 4 1"/>
    </g>
    <g transform="translate(86, 2)">
      <rect x="0" y="1" width="19" height="9.5" rx="2.6" fill="none" stroke="#f0f0f0" stroke-opacity="0.68" stroke-width="1.15"/>
      <rect x="2" y="2.8" width="12.5" height="5.8" rx="1.2" fill="#f0f0f0" fill-opacity="0.86"/>
      <rect x="20" y="3.8" width="1.6" height="3.8" rx="0.8" fill="#f0f0f0" fill-opacity="0.52"/>
      <text x="27" y="9" font-family="'Noto Sans Display', sans-serif" font-size="10.5" font-weight="600" fill="#f0f0f0" fill-opacity="0.8">84%</text>
    </g>
  </g>

  <!-- 3. ZEN CIRCULAR DIAL CENTERPIECE (Matching ClockSuiteView Circular Hairline Rings) -->
  <g transform="translate(960, 442)">
    <!-- Outer Hairline Track Circle (r=192) -->
    <circle cx="0" cy="0" r="192" fill="#000000" fill-opacity="0.24" stroke="#f0f0f0" stroke-opacity="0.10" stroke-width="1.2"/>

    <!-- Subtle 12-hour Minimalist Tick Marks -->
    <g stroke="#f0f0f0" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round">
      <line x1="0" y1="-192" x2="0" y2="-182"/>
      <line x1="192" y1="0" x2="182" y2="0"/>
      <line x1="0" y1="192" x2="0" y2="182"/>
      <line x1="-192" y1="0" x2="-182" y2="0"/>
    </g>

    <!-- Live Seconds / Auth Progress Luminous Arc (~45% around top-right) -->
    <!-- r=192, circumference = 1206.37 -->
    <circle cx="0" cy="0" r="192" fill="none" stroke="url(#progressArc)" stroke-width="2.2"
            stroke-linecap="round" stroke-dasharray="490 1207" transform="rotate(-90)" filter="url(#arcGlow)"/>

    <!-- Tiny Luminous Tip Dot at End of Progress Arc (approx 146 deg from top -> angle 56 deg) -->
    <circle cx="107.4" cy="159.2" r="3.2" fill="#ffffff" fill-opacity="0.95"/>

    <!-- Inner Typography inside Dial -->
    <g text-anchor="middle">
      <text x="0" y="-68" font-family="'Inter', sans-serif" font-size="13.5" font-weight="500" fill="#f0f0f0" fill-opacity="0.52" letter-spacing="3">27 KASIM · CUMA</text>
      <text x="0" y="34" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="108" font-weight="700" fill="#f0f0f0" fill-opacity="0.96" letter-spacing="-3">21:24</text>
      <text x="0" y="76" font-family="'Inter', sans-serif" font-size="12.5" font-weight="400" fill="#f0f0f0" fill-opacity="0.44" letter-spacing="0.8">excalibur</text>
    </g>
  </g>

  <!-- 4. Ultra-Minimal Password Capsule Below Ring -->
  <g transform="translate(960, 728)">
    <g transform="translate(-156, 0)" filter="url(#zenShadow)">
      <rect width="312" height="48" rx="24" fill="#000000" fill-opacity="0.62"/>
      <rect width="312" height="48" rx="24" fill="url(#zenInput)" stroke="#f0f0f0" stroke-opacity="0.22" stroke-width="1"/>

      <!-- Left Keyboard Layout Micro-Pill -->
      <rect x="8" y="10" width="32" height="28" rx="14" fill="#f0f0f0" fill-opacity="0.08"/>
      <text x="24" y="28" text-anchor="middle" font-family="'Noto Sans Display', sans-serif" font-size="11" font-weight="600" fill="#f0f0f0" fill-opacity="0.78">TR</text>

      <!-- Centered Minimalist Dot-Matrix Password Feedback -->
      <g fill="#f0f0f0">
        <circle cx="102" cy="24" r="3.4" fill-opacity="0.92"/>
        <circle cx="118" cy="24" r="3.4" fill-opacity="0.92"/>
        <circle cx="134" cy="24" r="3.4" fill-opacity="0.92"/>
        <circle cx="150" cy="24" r="3.4" fill-opacity="0.92"/>
        <circle cx="166" cy="24" r="3.4" fill-opacity="0.92"/>
        <circle cx="182" cy="24" r="3.4" fill-opacity="0.92"/>
        <circle cx="198" cy="24" r="3.4" fill-opacity="0.22"/>
        <circle cx="214" cy="24" r="3.4" fill-opacity="0.22"/>
      </g>

      <!-- Right Unlock Circle -->
      <g transform="translate(270, 6)">
        <circle cx="18" cy="18" r="18" fill="#f0f0f0" fill-opacity="0.92"/>
        <path d="M 13.5 18 H 22.5 M 18.5 13.5 L 23 18 L 18.5 22.5" fill="none" stroke="#000000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Subtle Hint -->
    <text x="0" y="76" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#f0f0f0" fill-opacity="0.36" letter-spacing="0.5">Doğrulamak için Enter'a basın</text>
  </g>

  <!-- 5. Bottom-Left Hairline Media Pill -->
  <g transform="translate(46, 988)">
    <rect width="268" height="48" rx="24" fill="#000000" fill-opacity="0.56" stroke="#f0f0f0" stroke-opacity="0.10" stroke-width="1"/>
    <!-- Animated Equalizer Bars -->
    <g transform="translate(18, 16)" fill="#f0f0f0" fill-opacity="0.82">
      <rect x="0" y="7" width="2.2" height="8" rx="1"/>
      <rect x="4.5" y="2" width="2.2" height="13" rx="1"/>
      <rect x="9" y="5" width="2.2" height="10" rx="1"/>
    </g>
    <text x="42" y="28.5" font-family="'Inter', sans-serif" font-size="12.5" font-weight="500" fill="#f0f0f0" fill-opacity="0.84">Midnight City</text>
    <text x="132" y="28.5" font-family="'Inter', sans-serif" font-size="12" fill="#f0f0f0" fill-opacity="0.42">· M83</text>
    <!-- Pause + Next Minimal -->
    <g transform="translate(208, 17)" fill="#f0f0f0" fill-opacity="0.8">
      <rect x="0" y="2" width="2.2" height="10" rx="1"/>
      <rect x="4.5" y="2" width="2.2" height="10" rx="1"/>
    </g>
    <g transform="translate(236, 17)" fill="#f0f0f0" fill-opacity="0.65">
      <path d="M 1 2 L 8 7 L 1 12 Z"/>
      <rect x="9.5" y="2.5" width="1.6" height="9" rx="0.8"/>
    </g>
  </g>

  <!-- 6. Bottom-Right Circular Power Controls (Direct Tribute to PowerOverlay.qml) -->
  <g transform="translate(1720, 988)">
    <!-- Sleep -->
    <g>
      <circle cx="24" cy="24" r="24" fill="#000000" fill-opacity="0.56" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
      <path d="M 27.2 18.6 A 6.4 6.4 0 1 0 29.6 27.8 A 5.1 5.1 0 1 1 27.2 18.6 Z" fill="none" stroke="#f0f0f0" stroke-opacity="0.76" stroke-width="1.45"/>
    </g>
    <!-- Reboot -->
    <g transform="translate(58, 0)">
      <circle cx="24" cy="24" r="24" fill="#000000" fill-opacity="0.56" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
      <path d="M 29.2 21.6 A 5.8 5.8 0 1 0 28.6 27.8" fill="none" stroke="#f0f0f0" stroke-opacity="0.76" stroke-width="1.45" stroke-linecap="round"/>
      <path d="M 29.5 18 V 22 H 25.5" fill="none" stroke="#f0f0f0" stroke-opacity="0.76" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Poweroff -->
    <g transform="translate(116, 0)">
      <circle cx="24" cy="24" r="24" fill="#000000" fill-opacity="0.56" stroke="#ff6b6b" stroke-opacity="0.26" stroke-width="1"/>
      <path d="M 20.4 19.6 A 6 6 0 1 0 27.6 19.6 M 24 16.6 V 23" fill="none" stroke="#ff6b6b" stroke-opacity="0.88" stroke-width="1.55" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 7. Screen Rounded Corners (14px Pure Black Hardware Cutouts) -->
  <g fill="#000000">
    <path d="M 0 0 H 14 A 14 14 0 0 0 0 14 Z"/>
    <path d="M 1920 0 H 1906 A 14 14 0 0 1 1920 14 Z"/>
    <path d="M 0 1080 H 14 A 14 14 0 0 1 0 1066 Z"/>
    <path d="M 1920 1080 H 1906 A 14 14 0 0 0 1920 1066 Z"/>
  </g>
</svg>
