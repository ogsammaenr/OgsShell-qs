<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Atmospheric Monochrome Architectural Wallpaper -->
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="50%" stop-color="#1b1d24"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </linearGradient>

    <radialGradient id="lightSweep2" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#454b59" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#22252e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0c10" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="arcWave1" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glassInput2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#f0f0f0" stop-opacity="0.06"/>
    </linearGradient>

    <filter id="topNotchShadow2" x="-15%" y="-10%" width="130%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="bottomNotchShadow2" x="-15%" y="-60%" width="130%" height="180%">
      <feDropShadow dx="0" dy="-10" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="blurSoft2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <!-- 1. Wallpaper Layer (85% Unobstructed Canvas) -->
  <rect width="1920" height="1080" fill="url(#bg2)"/>
  <rect width="1920" height="1080" fill="url(#lightSweep2)"/>

  <!-- Subtle Abstract Architectural Light Ribbons -->
  <g filter="url(#blurSoft2)">
    <path d="M -100 320 C 420 180, 960 560, 1520 380 C 1740 310, 1860 350, 2020 290 L 2020 560 C 1700 640, 1280 510, 880 650 C 480 790, 160 600, -100 660 Z" fill="url(#arcWave1)"/>
    <ellipse cx="960" cy="520" rx="460" ry="210" fill="#ffffff" fill-opacity="0.035"/>
  </g>

  <!-- 2. TOP DYNAMIC NOTCH (Pure OLED Black #000000 with Exact G2 Bezier Ears) -->
  <!-- Width: 440px body + 2*8px ears -> x=732..1188, height=44px -->
  <g filter="url(#topNotchShadow2)">
    <path d="M 732 0
             C 737 0, 740 7, 740 18
             L 740 24
             A 20 20 0 0 0 760 44
             L 1160 44
             A 20 20 0 0 0 1180 24
             L 1180 18
             C 1180 7, 1183 0, 1188 0
             Z"
          fill="#000000"/>
    <path d="M 740.5 24 A 19.5 19.5 0 0 0 760 43.5 L 1160 43.5 A 19.5 19.5 0 0 0 1179.5 24"
          fill="none" stroke="#f0f0f0" stroke-opacity="0.09" stroke-width="1"/>
  </g>

  <!-- Top Notch Content: Left = Media Mini Equalizer, Center = User/Lock, Right = Connectivity -->
  <g transform="translate(764, 12)">
    <!-- Mini Equalizer + Track -->
    <g fill="#f0f0f0" fill-opacity="0.85">
      <rect x="0" y="9" width="2.2" height="7" rx="1"/>
      <rect x="4" y="4" width="2.2" height="12" rx="1"/>
      <rect x="8" y="7" width="2.2" height="9" rx="1"/>
      <rect x="12" y="10" width="2.2" height="6" rx="1"/>
    </g>
    <text x="22" y="14" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#f0f0f0" fill-opacity="0.72">M83 · Midnight City</text>

    <!-- Center Divider + Lock Shield -->
    <line x1="150" y1="3" x2="150" y2="17" stroke="#f0f0f0" stroke-opacity="0.14" stroke-width="1"/>
    <g transform="translate(166, 2)" stroke="#f0f0f0" stroke-width="1.4" fill="none" opacity="0.9">
      <rect x="2" y="7" width="9.5" height="7" rx="1.8"/>
      <path d="M 4.4 7 V 4.8 A 2.3 2.3 0 0 1 9.1 4.8 V 7"/>
    </g>
    <text x="186" y="14" font-family="'Noto Sans Display', sans-serif" font-size="12" font-weight="600" fill="#f0f0f0" fill-opacity="0.9">excalibur</text>
    <line x1="256" y1="3" x2="256" y2="17" stroke="#f0f0f0" stroke-opacity="0.14" stroke-width="1"/>

    <!-- Right Connectivity: Wi-Fi + BT + Battery -->
    <g transform="translate(272, 4)" stroke="#f0f0f0" stroke-width="1.45" fill="none" stroke-linecap="round" opacity="0.86">
      <path d="M 1 4.2 A 9 9 0 0 1 13.5 4.2"/>
      <path d="M 3.5 7 A 5.4 5.4 0 0 1 11 7"/>
      <circle cx="7.25" cy="10.2" r="1.05" fill="#f0f0f0" stroke="none"/>
    </g>
    <g transform="translate(298, 3.5)" stroke="#f0f0f0" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
      <path d="M 4 1 L 4 12 L 8 9 L 1.2 3.8 M 1.2 9 L 8 3.8 L 4 1"/>
    </g>
    <g transform="translate(322, 4.5)">
      <rect x="0" y="1" width="20" height="10" rx="2.8" fill="none" stroke="#f0f0f0" stroke-opacity="0.7" stroke-width="1.2"/>
      <rect x="2" y="3" width="13.5" height="6" rx="1.2" fill="#f0f0f0" fill-opacity="0.88"/>
      <rect x="21" y="4" width="1.8" height="4" rx="0.8" fill="#f0f0f0" fill-opacity="0.6"/>
      <text x="28" y="9.5" font-family="'Noto Sans Display', sans-serif" font-size="11" font-weight="600" fill="#f0f0f0" fill-opacity="0.86">84%</text>
    </g>
  </g>

  <!-- 3. Center Editorial Clock (Clean, Balanced, Expansive Negative Space) -->
  <g text-anchor="middle">
    <!-- Subtle Day Pill -->
    <text x="960" y="382" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#f0f0f0" fill-opacity="0.58" letter-spacing="4">CUMA  ·  27 KASIM 2026</text>

    <!-- Ultra-Clean Monumental Clock with Thin Colon -->
    <text x="960" y="575" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="214" font-weight="700" fill="#f0f0f0" fill-opacity="0.95" letter-spacing="-6">21:24</text>

    <!-- Hairline Horizon Accent Under Clock -->
    <line x1="880" y1="612" x2="1040" y2="612" stroke="#f0f0f0" stroke-opacity="0.14" stroke-width="1"/>

    <!-- Minimalist Next Event / Alarm Subtitle -->
    <text x="960" y="644" font-family="'Inter', sans-serif" font-size="13.5" font-weight="400" fill="#f0f0f0" fill-opacity="0.54" letter-spacing="0.4">Sıradaki Alarm 07:30   ·   2 okunmamış bildirim</text>
  </g>

  <!-- 4. INVERTED BOTTOM NOTCH AUTH DOCK (Exact Mirrored G2 Bezier Ears of BottomCommandNotch) -->
  <!-- Body width: 596px (x=662..1258), ears 12px each -> x=650..1270, height=118px (y=962..1080) -->
  <g filter="url(#bottomNotchShadow2)">
    <path d="M 650 1080
             C 656 1080, 662 1068, 662 1052
             L 662 988
             A 26 26 0 0 1 688 962
             L 1232 962
             A 26 26 0 0 1 1258 988
             L 1258 1052
             C 1258 1068, 1264 1080, 1270 1080
             Z"
          fill="#000000"/>
    <!-- Crisp Top Specular Hairline -->
    <path d="M 662.5 988 A 25.5 25.5 0 0 1 688 962.5 L 1232 962.5 A 25.5 25.5 0 0 1 1257.5 988"
          fill="none" stroke="#f0f0f0" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <!-- Inside Inverted Bottom Notch (Symmetric 26px horizontal padding: content width = 544px -> x=688..1232) -->
  <g transform="translate(688, 982)">
    <!-- Top Row inside Bottom Notch: Password Input + Unlock Action -->
    <g>
      <!-- Left: Keyboard Layout Selector Pill -->
      <rect x="0" y="2" width="44" height="44" rx="22" fill="#f0f0f0" fill-opacity="0.07" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
      <text x="22" y="28.5" text-anchor="middle" font-family="'Noto Sans Display', sans-serif" font-size="13" font-weight="600" fill="#f0f0f0" fill-opacity="0.88">TR</text>

      <!-- Center: Password Capsule (352 x 46) -->
      <g transform="translate(56, 1)">
        <rect width="356" height="46" rx="23" fill="url(#glassInput2)" stroke="#f0f0f0" stroke-opacity="0.22" stroke-width="1"/>
        <!-- Password Dots -->
        <g fill="#f0f0f0" fill-opacity="0.92">
          <circle cx="26" cy="23" r="3.5"/>
          <circle cx="40" cy="23" r="3.5"/>
          <circle cx="54" cy="23" r="3.5"/>
          <circle cx="68" cy="23" r="3.5"/>
          <circle cx="82" cy="23" r="3.5"/>
          <circle cx="96" cy="23" r="3.5"/>
        </g>
        <rect x="108" y="13.5" width="1.6" height="19" rx="0.8" fill="#ffffff" fill-opacity="0.85"/>
        <!-- Show/Hide Eye -->
        <g transform="translate(278, 15)" stroke="#f0f0f0" stroke-opacity="0.48" stroke-width="1.35" fill="none">
          <path d="M 1 8 C 3.5 3.5, 12.5 3.5, 15 8 C 12.5 12.5, 3.5 12.5, 1 8 Z"/>
          <circle cx="8" cy="8" r="2.2"/>
        </g>
        <!-- Unlock Submit Circle -->
        <g transform="translate(314, 5)">
          <circle cx="18" cy="18" r="18" fill="#f0f0f0" fill-opacity="0.94"/>
          <path d="M 13.5 18 H 22.5 M 18.5 13.5 L 23 18 L 18.5 22.5" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Right: Compact Session Control Buttons (Sleep / Reboot / Power) -->
      <g transform="translate(424, 6)">
        <!-- Sleep -->
        <circle cx="18" cy="18" r="18" fill="#f0f0f0" fill-opacity="0.07" stroke="#f0f0f0" stroke-opacity="0.10" stroke-width="1"/>
        <path d="M 20.8 13.2 A 5.5 5.5 0 1 0 22.8 21.2 A 4.4 4.4 0 1 1 20.8 13.2 Z" fill="none" stroke="#f0f0f0" stroke-opacity="0.76" stroke-width="1.35" stroke-linejoin="round"/>

        <!-- Reboot -->
        <g transform="translate(42, 0)">
          <circle cx="18" cy="18" r="18" fill="#f0f0f0" fill-opacity="0.07" stroke="#f0f0f0" stroke-opacity="0.10" stroke-width="1"/>
          <path d="M 22.5 15.8 A 5.1 5.1 0 1 0 22 21.4" fill="none" stroke="#f0f0f0" stroke-opacity="0.76" stroke-width="1.35" stroke-linecap="round"/>
          <path d="M 22.8 12.6 V 16.2 H 19.2" fill="none" stroke="#f0f0f0" stroke-opacity="0.76" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Poweroff -->
        <g transform="translate(84, 0)">
          <circle cx="18" cy="18" r="18" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b" stroke-opacity="0.28" stroke-width="1"/>
          <path d="M 14.8 14.2 A 5.2 5.2 0 1 0 21.2 14.2 M 18 11.8 V 17.4" fill="none" stroke="#ff6b6b" stroke-opacity="0.92" stroke-width="1.45" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- Bottom Micro-Footer inside Inverted Notch -->
    <g transform="translate(0, 66)">
      <text x="272" y="12" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#f0f0f0" fill-opacity="0.40" letter-spacing="0.4">Enter ile doğrula  ·  Hyprland Wayland Oturumu  ·  Caps Lock Kapalı</text>
    </g>
  </g>

  <!-- 5. Screen Rounded Corners (14px Pure Black Hardware Cutouts) -->
  <g fill="#000000">
    <path d="M 0 0 H 14 A 14 14 0 0 0 0 14 Z"/>
    <path d="M 1920 0 H 1906 A 14 14 0 0 1 1920 14 Z"/>
    <path d="M 0 1080 H 14 A 14 14 0 0 1 0 1066 Z"/>
    <path d="M 1920 1080 H 1906 A 14 14 0 0 0 1920 1066 Z"/>
  </g>
</svg>
