<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Deep Atmospheric Monochrome Wallpaper -->
    <linearGradient id="bg6" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0d0e12"/>
      <stop offset="48%" stop-color="#171920"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>

    <radialGradient id="centerGlow6" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#3d4352" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#1d2028" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#090a0d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="topAmbient6" cx="50%" cy="0%" r="34%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="horizonWaveBack6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22252f" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#0d0f14" stop-opacity="0.86"/>
    </linearGradient>

    <linearGradient id="horizonWaveFront6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16181f" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#08090c" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Clock Luminous Silver-White Gradient -->
    <linearGradient id="clockGrad6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#cfd3dc" stop-opacity="0.84"/>
    </linearGradient>

    <!-- Frosted Glass Input inside Notch -->
    <linearGradient id="notchInputGrad6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#f0f0f0" stop-opacity="0.055"/>
    </linearGradient>

    <!-- Shadows matching OgsShell config.json expanded shadow tokens -->
    <filter id="notchDropShadow6" x="-15%" y="-10%" width="130%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000000" flood-opacity="0.72"/>
    </filter>

    <filter id="pillShadow6" x="-15%" y="-25%" width="130%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
  </defs>

  <!-- 1. Atmospheric Monochrome Wallpaper (Artifact-free layered gradients) -->
  <rect width="1920" height="1080" fill="url(#bg6)"/>
  <rect width="1920" height="1080" fill="url(#centerGlow6)"/>
  <rect width="1920" height="1080" fill="url(#topAmbient6)"/>

  <!-- Smooth Monochrome Horizon Contours -->
  <g>
    <path d="M 0 760 C 340 600, 720 670, 1120 580 C 1460 500, 1720 570, 1920 520 L 1920 1080 L 0 1080 Z" fill="url(#horizonWaveBack6)"/>
    <path d="M 0 870 C 420 760, 840 840, 1280 755 C 1580 695, 1780 735, 1920 705 L 1920 1080 L 0 1080 Z" fill="url(#horizonWaveFront6)"/>
  </g>

  <!-- 2. TOP DYNAMIC NOTCH / ISLAND AUTHENTICATION HUB -->
  <!-- Exact OgsShell expanded_width = 500px (x=710..1210), G2 Bezier Ears (12px each -> x=698..1222), height = 140px, bottom_radius = 28px -->
  <g filter="url(#notchDropShadow6)">
    <path d="M 698 0
             C 705 0, 710 12, 710 28
             L 710 112
             A 28 28 0 0 0 738 140
             L 1182 140
             A 28 28 0 0 0 1210 112
             L 1210 28
             C 1210 12, 1215 0, 1222 0
             Z"
          fill="#000000"/>
    <!-- Subtle Specular Bottom Rim Hairline -->
    <path d="M 710.5 112 A 27.5 27.5 0 0 0 738 139.5 L 1182 139.5 A 27.5 27.5 0 0 0 1209.5 112"
          fill="none" stroke="#f0f0f0" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <!-- Contents inside Top Notch Auth Hub (Symmetric 24px padding: x=734..1186, inner width = 452px) -->
  <g transform="translate(734, 16)">
    <!-- Top Status Row inside Notch -->
    <g>
      <!-- Left: Lock Glyph + User Identity -->
      <g stroke="#f0f0f0" stroke-width="1.45" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
        <rect x="2" y="7" width="9.5" height="7" rx="1.8"/>
        <path d="M 4.4 7 V 4.8 A 2.3 2.3 0 0 1 9.1 4.8 V 7"/>
      </g>
      <text x="20" y="13.5" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="13" font-weight="600" fill="#f0f0f0" fill-opacity="0.92">excalibur</text>
      <circle cx="88" cy="9.5" r="2" fill="#f0f0f0" fill-opacity="0.32"/>
      <text x="98" y="13.5" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#f0f0f0" fill-opacity="0.48">Oturum Kilitli</text>

      <!-- Right: TR Badge + Wi-Fi + Bluetooth + Battery -->
      <g transform="translate(306, 1)">
        <!-- Keyboard Layout Pill -->
        <rect x="0" y="0" width="26" height="17" rx="5.5" fill="#f0f0f0" fill-opacity="0.10"/>
        <text x="13" y="12" text-anchor="middle" font-family="'Noto Sans Display', sans-serif" font-size="10.5" font-weight="600" fill="#f0f0f0" fill-opacity="0.88">TR</text>

        <!-- Wi-Fi -->
        <g transform="translate(38, 2)" stroke="#f0f0f0" stroke-width="1.45" fill="none" stroke-linecap="round" opacity="0.86">
          <path d="M 1 4.5 A 9 9 0 0 1 13.5 4.5"/>
          <path d="M 3.6 7.3 A 5.4 5.4 0 0 1 10.9 7.3"/>
          <circle cx="7.25" cy="10.4" r="1.05" fill="#f0f0f0" stroke="none"/>
        </g>

        <!-- Bluetooth -->
        <g transform="translate(64, 1.5)" stroke="#f0f0f0" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.74">
          <path d="M 4 1 L 4 12 L 8 9 L 1.2 3.8 M 1.2 9 L 8 3.8 L 4 1"/>
        </g>

        <!-- Battery -->
        <g transform="translate(88, 2.5)">
          <rect x="0" y="1" width="20" height="10" rx="2.8" fill="none" stroke="#f0f0f0" stroke-opacity="0.72" stroke-width="1.2"/>
          <rect x="2" y="3" width="13.5" height="6" rx="1.2" fill="#f0f0f0" fill-opacity="0.88"/>
          <rect x="21" y="4" width="1.8" height="4" rx="0.8" fill="#f0f0f0" fill-opacity="0.56"/>
          <text x="28" y="9.5" font-family="'Noto Sans Display', sans-serif" font-size="11" font-weight="600" fill="#f0f0f0" fill-opacity="0.86">84%</text>
        </g>
      </g>
    </g>

    <!-- Primary Password Input Capsule inside Notch (452 x 48, rx=24) -->
    <g transform="translate(0, 34)">
      <rect width="452" height="48" rx="24" fill="url(#notchInputGrad6)" stroke="#f0f0f0" stroke-opacity="0.26" stroke-width="1.1"/>

      <!-- Password Dots -->
      <g fill="#f0f0f0" fill-opacity="0.94">
        <circle cx="26" cy="24" r="3.6"/>
        <circle cx="40" cy="24" r="3.6"/>
        <circle cx="54" cy="24" r="3.6"/>
        <circle cx="68" cy="24" r="3.6"/>
        <circle cx="82" cy="24" r="3.6"/>
        <circle cx="96" cy="24" r="3.6"/>
        <circle cx="110" cy="24" r="3.6"/>
        <circle cx="124" cy="24" r="3.6"/>
      </g>
      <!-- Active Blinking Caret -->
      <rect x="137" y="14" width="1.6" height="20" rx="0.8" fill="#ffffff" fill-opacity="0.88"/>

      <!-- Eye Icon (Toggle Password Visibility) -->
      <g transform="translate(374, 16)" stroke="#f0f0f0" stroke-opacity="0.48" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 1 8 C 3.5 3.5, 12.5 3.5, 15 8 C 12.5 12.5, 3.5 12.5, 1 8 Z"/>
        <circle cx="8" cy="8" r="2.2"/>
      </g>

      <!-- Circular Unlock Submit Button -->
      <g transform="translate(408, 6)">
        <circle cx="18" cy="18" r="18" fill="#f0f0f0" fill-opacity="0.94"/>
        <path d="M 13.5 18 H 22.5 M 18.5 13.5 L 23 18 L 18.5 22.5" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Bottom Micro-Footer inside Notch -->
    <g transform="translate(0, 102)">
      <text x="226" y="4" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#f0f0f0" fill-opacity="0.40" letter-spacing="0.4">Parolanızı girip Enter'a basın</text>
    </g>
  </g>

  <!-- 3. CENTERPIECE: MONUMENTAL CLOCK + SMALL DATE INDICATOR DIRECTLY BENEATH -->
  <g text-anchor="middle">
    <!-- Large Hero Clock (Dead-center focal point) -->
    <text x="960" y="592" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="232" font-weight="700" fill="url(#clockGrad6)" letter-spacing="-7">21:24</text>

    <!-- Small, Minimalist Date Indicator Directly Below the Clock -->
    <text x="960" y="650" font-family="'Inter', 'Noto Sans', sans-serif" font-size="19" font-weight="500" fill="#f0f0f0" fill-opacity="0.62" letter-spacing="3.2">27 KASIM CUMA · 2026</text>
  </g>

  <!-- 4. Whisper-Quiet Peripheral Controls (Bottom Corners) -->
  <!-- Bottom-Left: Minimal Single-Line Media Pill -->
  <g transform="translate(46, 986)" filter="url(#pillShadow6)">
    <rect width="276" height="48" rx="24" fill="#000000" fill-opacity="0.78" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
    <!-- Mini Equalizer -->
    <g transform="translate(18, 16)" fill="#f0f0f0" fill-opacity="0.84">
      <rect x="0" y="7" width="2.2" height="8" rx="1"/>
      <rect x="4.5" y="2" width="2.2" height="13" rx="1"/>
      <rect x="9" y="5" width="2.2" height="10" rx="1"/>
    </g>
    <text x="42" y="28.5" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#f0f0f0" fill-opacity="0.88">Midnight City</text>
    <text x="132" y="28.5" font-family="'Inter', sans-serif" font-size="12" fill="#f0f0f0" fill-opacity="0.44">· M83</text>
    <!-- Pause + Next -->
    <g transform="translate(216, 17)" fill="#f0f0f0" fill-opacity="0.82">
      <rect x="0" y="2" width="2.2" height="10" rx="1"/>
      <rect x="4.5" y="2" width="2.2" height="10" rx="1"/>
    </g>
    <g transform="translate(244, 17)" fill="#f0f0f0" fill-opacity="0.66">
      <path d="M 1 2 L 8 7 L 1 12 Z"/>
      <rect x="9.5" y="2.5" width="1.6" height="9" rx="0.8"/>
    </g>
  </g>

  <!-- Bottom-Right: Minimal Circular Session Buttons (PowerOverlay DNA) -->
  <g transform="translate(1720, 986)">
    <!-- Suspend -->
    <g>
      <circle cx="24" cy="24" r="24" fill="#000000" fill-opacity="0.68" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
      <path d="M 27.2 18.6 A 6.4 6.4 0 1 0 29.6 27.8 A 5.1 5.1 0 1 1 27.2 18.6 Z" fill="none" stroke="#f0f0f0" stroke-opacity="0.78" stroke-width="1.45"/>
    </g>
    <!-- Reboot -->
    <g transform="translate(58, 0)">
      <circle cx="24" cy="24" r="24" fill="#000000" fill-opacity="0.68" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
      <path d="M 29.2 21.6 A 5.8 5.8 0 1 0 28.6 27.8" fill="none" stroke="#f0f0f0" stroke-opacity="0.78" stroke-width="1.45" stroke-linecap="round"/>
      <path d="M 29.5 18 V 22 H 25.5" fill="none" stroke="#f0f0f0" stroke-opacity="0.78" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Poweroff -->
    <g transform="translate(116, 0)">
      <circle cx="24" cy="24" r="24" fill="#000000" fill-opacity="0.68" stroke="#ff6b6b" stroke-opacity="0.28" stroke-width="1"/>
      <path d="M 20.4 19.6 A 6 6 0 1 0 27.6 19.6 M 24 16.6 V 23" fill="none" stroke="#ff6b6b" stroke-opacity="0.90" stroke-width="1.55" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 5. OgsShell Screen Rounded Corners (14px Pure Black Hardware Cutouts) -->
  <g fill="#000000">
    <path d="M 0 0 H 14 A 14 14 0 0 0 0 14 Z"/>
    <path d="M 1920 0 H 1906 A 14 14 0 0 1 1920 14 Z"/>
    <path d="M 0 1080 H 14 A 14 14 0 0 1 0 1066 Z"/>
    <path d="M 1920 1080 H 1906 A 14 14 0 0 0 1920 1066 Z"/>
  </g>
</svg>
