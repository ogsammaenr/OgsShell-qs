<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Refined Monochrome Architectural Wallpaper -->
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1014"/>
      <stop offset="55%" stop-color="#181a21"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>

    <radialGradient id="leftGlow4" cx="24%" cy="52%" r="54%">
      <stop offset="0%" stop-color="#3c414d" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#1b1e25" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="panelGlass4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="inputGlass4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f0f0f0" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="panelShadow4" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000000" flood-opacity="0.68"/>
    </filter>

    <filter id="notchShadow4" x="-20%" y="-10%" width="140%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="blur4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- 1. Atmospheric Background -->
  <rect width="1920" height="1080" fill="url(#bg4)"/>
  <rect width="1920" height="1080" fill="url(#leftGlow4)"/>

  <!-- Subtle Monochrome Architectural Curves (Artifact-free smooth layers) -->
  <g>
    <path d="M 0 680 C 360 540, 740 650, 1240 480 C 1540 380, 1760 440, 1920 390 L 1920 1080 L 0 1080 Z" fill="#13151c" fill-opacity="0.58"/>
    <path d="M 0 840 C 420 740, 820 820, 1340 700 C 1600 640, 1780 680, 1920 650 L 1920 1080 L 0 1080 Z" fill="#0c0d12" fill-opacity="0.78"/>
  </g>

  <!-- 2. Compact Top Dynamic Notch (Pure OLED Black #000000) -->
  <g filter="url(#notchShadow4)">
    <path d="M 852 0
             C 857 0, 860 6, 860 14
             L 860 16
             A 16 16 0 0 0 876 32
             L 1044 32
             A 16 16 0 0 0 1060 16
             L 1060 14
             C 1060 6, 1063 0, 1068 0
             Z"
          fill="#000000"/>
    <path d="M 860.5 16 A 15.5 15.5 0 0 0 876 31.5 L 1044 31.5 A 15.5 15.5 0 0 0 1059.5 16"
          fill="none" stroke="#f0f0f0" stroke-opacity="0.09" stroke-width="1"/>
  </g>
  <!-- Top Notch Micro-Status -->
  <g transform="translate(886, 9)">
    <g stroke="#f0f0f0" stroke-width="1.4" fill="none" opacity="0.88">
      <rect x="2" y="6.5" width="9" height="6.8" rx="1.8"/>
      <path d="M 4.3 6.5 V 4.5 A 2.2 2.2 0 0 1 8.7 4.5 V 6.5"/>
    </g>
    <text x="20" y="12" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#f0f0f0" fill-opacity="0.68">Oturum Kilitli</text>
    <circle cx="104" cy="8" r="2.2" fill="#e0e0e0" fill-opacity="0.7"/>
    <text x="114" y="12" font-family="'Noto Sans Display', sans-serif" font-size="11" font-weight="600" fill="#f0f0f0" fill-opacity="0.84">84%</text>
  </g>

  <!-- 3. LEFT EDITORIAL HERO CANVAS (Oversized Stacked Clock + Live Telemetry + Media) -->
  <g transform="translate(116, 130)">
    <!-- Date Eyebrow -->
    <text x="4" y="28" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#f0f0f0" fill-opacity="0.54" letter-spacing="3.2">CUMA · 27 KASIM 2026</text>

    <!-- Monumental Dual-Weight Stacked Clock -->
    <text x="-8" y="276" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="260" font-weight="700" fill="#f0f0f0" fill-opacity="0.96" letter-spacing="-10">21</text>
    <text x="-8" y="510" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="260" font-weight="300" fill="#f0f0f0" fill-opacity="0.72" letter-spacing="-10">24</text>

    <!-- Subtle Vertical Divider & Telemetry Strip (Echoing PinnedMetricsWidget) -->
    <g transform="translate(4, 578)">
      <line x1="0" y1="0" x2="360" y2="0" stroke="#f0f0f0" stroke-opacity="0.12" stroke-width="1"/>

      <!-- Telemetry Row -->
      <g transform="translate(0, 32)" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="12.5">
        <text x="0" y="0" fill="#f0f0f0" fill-opacity="0.44" font-weight="500">CPU</text>
        <text x="34" y="0" fill="#f0f0f0" fill-opacity="0.88" font-weight="600">6%</text>

        <circle cx="72" cy="-4" r="1.8" fill="#f0f0f0" fill-opacity="0.28"/>

        <text x="88" y="0" fill="#f0f0f0" fill-opacity="0.44" font-weight="500">RAM</text>
        <text x="124" y="0" fill="#f0f0f0" fill-opacity="0.88" font-weight="600">4.2 GB</text>

        <circle cx="182" cy="-4" r="1.8" fill="#f0f0f0" fill-opacity="0.28"/>

        <text x="198" y="0" fill="#f0f0f0" fill-opacity="0.44" font-weight="500">SICAKLIK</text>
        <text x="266" y="0" fill="#f0f0f0" fill-opacity="0.88" font-weight="600">46°C</text>
      </g>
    </g>

    <!-- Bottom-Left Editorial Media Bar -->
    <g transform="translate(0, 742)">
      <rect width="390" height="84" rx="24" fill="#000000" fill-opacity="0.78" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
      <rect x="14" y="14" width="56" height="56" rx="14" fill="#1e2027" stroke="#f0f0f0" stroke-opacity="0.14" stroke-width="1"/>
      <!-- Equalizer inside cover -->
      <g transform="translate(31, 32)" fill="#f0f0f0" fill-opacity="0.82">
        <rect x="0" y="9" width="3" height="10" rx="1.5"/>
        <rect x="6" y="2" width="3" height="17" rx="1.5"/>
        <rect x="12" y="6" width="3" height="13" rx="1.5"/>
        <rect x="18" y="11" width="3" height="8" rx="1.5"/>
      </g>
      <text x="86" y="36" font-family="'Noto Sans Display', sans-serif" font-size="14" font-weight="600" fill="#f0f0f0" fill-opacity="0.92">Midnight City</text>
      <text x="86" y="54" font-family="'Inter', sans-serif" font-size="12" fill="#f0f0f0" fill-opacity="0.5">M83 · Hurry Up, We're Dreaming</text>
      <!-- Pause & Next -->
      <g transform="translate(316, 26)">
        <circle cx="16" cy="16" r="16" fill="#f0f0f0" fill-opacity="0.10"/>
        <rect x="12" y="11" width="2.4" height="10" rx="1" fill="#f0f0f0" fill-opacity="0.9"/>
        <rect x="17" y="11" width="2.4" height="10" rx="1" fill="#f0f0f0" fill-opacity="0.9"/>
      </g>
      <g transform="translate(358, 34)" fill="#f0f0f0" fill-opacity="0.72">
        <path d="M 1 2 L 8 7 L 1 12 Z"/>
        <rect x="9.5" y="2.5" width="1.8" height="9" rx="0.8"/>
      </g>
    </g>
  </g>

  <!-- 4. RIGHT FLOATING OLED GLASS AUTH & CONTROL DOCK (420 x 820, rx=32) -->
  <g transform="translate(1384, 130)" filter="url(#panelShadow4)">
    <rect width="420" height="820" rx="32" fill="url(#panelGlass4)"/>
    <rect x="0.5" y="0.5" width="419" height="819" rx="31.5" fill="none" stroke="#f0f0f0" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Top Status Row inside Right Dock -->
    <g transform="translate(28, 28)">
      <text x="0" y="14" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#f0f0f0" fill-opacity="0.46" letter-spacing="1.2">KİMLİK DOĞRULAMA</text>

      <!-- Connectivity Icons -->
      <g transform="translate(292, 0)">
        <!-- Wi-Fi -->
        <g stroke="#f0f0f0" stroke-width="1.45" fill="none" stroke-linecap="round" opacity="0.82">
          <path d="M 1 4.5 A 9 9 0 0 1 13.5 4.5"/>
          <path d="M 3.6 7.3 A 5.4 5.4 0 0 1 10.9 7.3"/>
          <circle cx="7.25" cy="10.4" r="1.05" fill="#f0f0f0" stroke="none"/>
        </g>
        <!-- Bluetooth -->
        <g transform="translate(26, 0)" stroke="#f0f0f0" stroke-width="1.35" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75">
          <path d="M 4 1 L 4 12 L 8 9 L 1.2 3.8 M 1.2 9 L 8 3.8 L 4 1"/>
        </g>
        <!-- TR Pill -->
        <rect x="46" y="-2" width="26" height="17" rx="5.5" fill="#f0f0f0" fill-opacity="0.10"/>
        <text x="59" y="10" text-anchor="middle" font-family="'Noto Sans Display', sans-serif" font-size="10.5" font-weight="600" fill="#f0f0f0" fill-opacity="0.88">TR</text>
      </g>
    </g>

    <!-- User Profile Centerpiece -->
    <g transform="translate(210, 148)" text-anchor="middle">
      <circle cx="0" cy="0" r="46" fill="#f0f0f0" fill-opacity="0.06" stroke="#f0f0f0" stroke-opacity="0.16" stroke-width="1.2"/>
      <circle cx="0" cy="-8" r="13" fill="none" stroke="#f0f0f0" stroke-opacity="0.88" stroke-width="2"/>
      <path d="M -22 22 C -22 9, -11 4.5, 0 4.5 C 11 4.5, 22 9, 22 22" fill="none" stroke="#f0f0f0" stroke-opacity="0.88" stroke-width="2" stroke-linecap="round"/>

      <text x="0" y="78" font-family="'Noto Sans Display', sans-serif" font-size="22" font-weight="600" fill="#f0f0f0" fill-opacity="0.95">excalibur</text>
      <text x="0" y="100" font-family="'Inter', sans-serif" font-size="12.5" fill="#f0f0f0" fill-opacity="0.46">Hyprland · Wayland Oturumu</text>
    </g>

    <!-- Password Input Field + Primary Action -->
    <g transform="translate(28, 286)">
      <rect width="364" height="50" rx="25" fill="url(#inputGlass4)" stroke="#f0f0f0" stroke-opacity="0.26" stroke-width="1.1"/>
      <g fill="#f0f0f0" fill-opacity="0.94">
        <circle cx="26" cy="25" r="3.6"/>
        <circle cx="40" cy="25" r="3.6"/>
        <circle cx="54" cy="25" r="3.6"/>
        <circle cx="68" cy="25" r="3.6"/>
        <circle cx="82" cy="25" r="3.6"/>
        <circle cx="96" cy="25" r="3.6"/>
        <circle cx="110" cy="25" r="3.6"/>
      </g>
      <rect x="124" y="15" width="1.6" height="20" rx="0.8" fill="#ffffff" fill-opacity="0.86"/>
      <!-- Eye Icon -->
      <g transform="translate(328, 17)" stroke="#f0f0f0" stroke-opacity="0.48" stroke-width="1.4" fill="none">
        <path d="M 1 8 C 3.5 3.5, 12.5 3.5, 15 8 C 12.5 12.5, 3.5 12.5, 1 8 Z"/>
        <circle cx="8" cy="8" r="2.2"/>
      </g>

      <!-- Full-Width Minimal Submit Capsule -->
      <g transform="translate(0, 64)">
        <rect width="364" height="46" rx="23" fill="#f0f0f0" fill-opacity="0.94"/>
        <text x="182" y="28" text-anchor="middle" font-family="'Noto Sans Display', sans-serif" font-size="14" font-weight="600" fill="#000000">Oturumun Kilidini Aç</text>
      </g>
    </g>

    <!-- Hairline Divider -->
    <line x1="28" y1="436" x2="392" y2="436" stroke="#f0f0f0" stroke-opacity="0.09" stroke-width="1"/>

    <!-- Minimalist Notifications & Schedule Peek -->
    <g transform="translate(28, 460)">
      <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#f0f0f0" fill-opacity="0.44" letter-spacing="1.2">ÖZET</text>

      <!-- Item 1: Next Alarm -->
      <g transform="translate(0, 28)">
        <rect width="364" height="58" rx="18" fill="#f0f0f0" fill-opacity="0.045" stroke="#f0f0f0" stroke-opacity="0.08" stroke-width="1"/>
        <circle cx="28" cy="29" r="14" fill="#f0f0f0" fill-opacity="0.08"/>
        <g transform="translate(21, 22)" stroke="#f0f0f0" stroke-opacity="0.82" stroke-width="1.35" fill="none" stroke-linecap="round">
          <circle cx="7" cy="7.5" r="5"/>
          <path d="M 7 4.8 V 7.6 L 9 8.8"/>
        </g>
        <text x="54" y="25" font-family="'Noto Sans Display', sans-serif" font-size="13" font-weight="600" fill="#f0f0f0" fill-opacity="0.9">Hafta İçi Uyanma</text>
        <text x="54" y="42" font-family="'Inter', sans-serif" font-size="11.5" fill="#f0f0f0" fill-opacity="0.48">Yarın · 07:30</text>
      </g>

      <!-- Item 2: Unread Notifications (Privacy-masked) -->
      <g transform="translate(0, 98)">
        <rect width="364" height="58" rx="18" fill="#f0f0f0" fill-opacity="0.045" stroke="#f0f0f0" stroke-opacity="0.08" stroke-width="1"/>
        <circle cx="28" cy="29" r="14" fill="#f0f0f0" fill-opacity="0.08"/>
        <g transform="translate(20, 21)" stroke="#f0f0f0" stroke-opacity="0.82" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 13 11 H 3 C 4.2 9.8, 4.6 8.3, 4.6 6.5 A 3.4 3.4 0 0 1 11.4 6.5 C 11.4 8.3, 11.8 9.8, 13 11 Z"/>
          <path d="M 6.7 13.5 A 1.5 1.5 0 0 0 9.3 13.5"/>
        </g>
        <text x="54" y="25" font-family="'Noto Sans Display', sans-serif" font-size="13" font-weight="600" fill="#f0f0f0" fill-opacity="0.9">2 yeni bildirim</text>
        <text x="54" y="42" font-family="'Inter', sans-serif" font-size="11.5" fill="#f0f0f0" fill-opacity="0.48">İçerik gizlendi · Kilit açıkken görüntülenir</text>
      </g>
    </g>

    <!-- Bottom Session Action Buttons (Circular Glass Matching PowerOverlay) -->
    <g transform="translate(56, 710)">
      <!-- Suspend -->
      <g>
        <circle cx="42" cy="28" r="26" fill="#f0f0f0" fill-opacity="0.06" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
        <path d="M 45.5 22.5 A 6.8 6.8 0 1 0 48 32.2 A 5.4 5.4 0 1 1 45.5 22.5 Z" fill="none" stroke="#f0f0f0" stroke-opacity="0.8" stroke-width="1.5"/>
        <text x="42" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11.5" fill="#f0f0f0" fill-opacity="0.54">Uyku</text>
      </g>
      <!-- Reboot -->
      <g transform="translate(112, 0)">
        <circle cx="42" cy="28" r="26" fill="#f0f0f0" fill-opacity="0.06" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
        <path d="M 47.5 25.5 A 6.2 6.2 0 1 0 46.8 32" fill="none" stroke="#f0f0f0" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M 47.8 21.5 V 25.8 H 43.5" fill="none" stroke="#f0f0f0" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11.5" fill="#f0f0f0" fill-opacity="0.54">Yeniden Başlat</text>
      </g>
      <!-- Poweroff -->
      <g transform="translate(224, 0)">
        <circle cx="42" cy="28" r="26" fill="#ff6b6b" fill-opacity="0.10" stroke="#ff6b6b" stroke-opacity="0.28" stroke-width="1"/>
        <path d="M 38.2 23.4 A 6.4 6.4 0 1 0 45.8 23.4 M 42 20.2 V 27" fill="none" stroke="#ff6b6b" stroke-opacity="0.92" stroke-width="1.6" stroke-linecap="round"/>
        <text x="42" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11.5" fill="#ff6b6b" fill-opacity="0.82">Kapat</text>
      </g>
    </g>
  </g>

  <!-- 5. Screen Rounded Corners (14px Pure Black Hardware Cutouts) -->
  <g fill="#000000">
    <path d="M 0 0 H 14 A 14 14 0 0 0 0 14 Z"/>
    <path d="M 1920 0 H 1906 A 14 14 0 0 1 1920 14 Z"/>
    <path d="M 0 1080 H 14 A 14 14 0 0 1 0 1066 Z"/>
    <path d="M 1920 1080 H 1906 A 14 14 0 0 0 1920 1066 Z"/>
  </g>
</svg>
