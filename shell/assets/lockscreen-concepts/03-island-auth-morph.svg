<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Deep Minimal Monochrome Wallpaper -->
    <linearGradient id="bg3" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#111216"/>
      <stop offset="52%" stop-color="#191b22"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>

    <radialGradient id="halo3" cx="50%" cy="62%" r="48%">
      <stop offset="0%" stop-color="#3c4250" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#1c1f27" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0a0b0e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="topGlow3" cx="50%" cy="14%" r="36%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="islandInput3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#f0f0f0" stop-opacity="0.06"/>
    </linearGradient>

    <filter id="islandDropShadow3" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#000000" flood-opacity="0.72"/>
    </filter>

    <filter id="cardShadow3" x="-15%" y="-20%" width="130%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.56"/>
    </filter>

    <filter id="blur3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1920" height="1080" fill="url(#bg3)"/>
  <rect width="1920" height="1080" fill="url(#halo3)"/>
  <rect width="1920" height="1080" fill="url(#topGlow3)"/>

  <!-- Subtle Abstract Minimal Dune Curves (Artifact-free smooth layers) -->
  <g>
    <path d="M 0 840 Q 480 650, 960 760 T 1920 700 L 1920 1080 L 0 1080 Z" fill="#171a22" fill-opacity="0.62"/>
    <path d="M 0 940 Q 540 830, 1080 900 T 1920 850 L 1920 1080 L 0 1080 Z" fill="#101218" fill-opacity="0.82"/>
  </g>

  <!-- 2. FLOATING EXPANDED DYNAMIC ISLAND AUTH HUB (Pure OLED Black #000000, Morphing like KeyringPromptModal) -->
  <!-- Centered at x=960 -> x=720..1200 (width=480), y=26..242 (height=216), rx=30 -->
  <g transform="translate(720, 26)" filter="url(#islandDropShadow3)">
    <rect width="480" height="216" rx="30" fill="#000000"/>
    <rect x="0.5" y="0.5" width="479" height="215" rx="29.5" fill="none" stroke="#f0f0f0" stroke-opacity="0.14" stroke-width="1"/>

    <!-- Top Row inside Island: Shield Badge + User/Status + Connectivity -->
    <g transform="translate(22, 20)">
      <!-- Circular Lock Shield Badge -->
      <circle cx="20" cy="20" r="20" fill="#f0f0f0" fill-opacity="0.09" stroke="#f0f0f0" stroke-opacity="0.14" stroke-width="1"/>
      <g transform="translate(13, 12)" stroke="#f0f0f0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="10" height="7.5" rx="2"/>
        <path d="M 4.5 7 V 4.8 A 2.5 2.5 0 0 1 9.5 4.8 V 7"/>
      </g>

      <!-- User Identity -->
      <text x="52" y="17" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="14.5" font-weight="600" fill="#f0f0f0" fill-opacity="0.94">excalibur</text>
      <text x="52" y="34" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#f0f0f0" fill-opacity="0.48">Oturum Kilitli · Hyprland</text>

      <!-- Right Status Cluster inside Island -->
      <g transform="translate(300, 11)">
        <!-- TR Pill -->
        <rect x="0" y="0" width="28" height="18" rx="6" fill="#f0f0f0" fill-opacity="0.10"/>
        <text x="14" y="12.5" text-anchor="middle" font-family="'Noto Sans Display', sans-serif" font-size="10.5" font-weight="600" fill="#f0f0f0" fill-opacity="0.88">TR</text>

        <!-- Wi-Fi -->
        <g transform="translate(40, 2)" stroke="#f0f0f0" stroke-width="1.45" fill="none" stroke-linecap="round" opacity="0.85">
          <path d="M 1 4.5 A 9 9 0 0 1 13.5 4.5"/>
          <path d="M 3.6 7.3 A 5.4 5.4 0 0 1 10.9 7.3"/>
          <circle cx="7.25" cy="10.4" r="1.05" fill="#f0f0f0" stroke="none"/>
        </g>

        <!-- Battery -->
        <g transform="translate(68, 3)">
          <rect x="0" y="1" width="20" height="10" rx="2.8" fill="none" stroke="#f0f0f0" stroke-opacity="0.72" stroke-width="1.2"/>
          <rect x="2" y="3" width="13.5" height="6" rx="1.2" fill="#f0f0f0" fill-opacity="0.88"/>
          <rect x="21" y="4" width="1.8" height="4" rx="0.8" fill="#f0f0f0" fill-opacity="0.55"/>
          <text x="28" y="9.5" font-family="'Noto Sans Display', sans-serif" font-size="11" font-weight="600" fill="#f0f0f0" fill-opacity="0.84">84%</text>
        </g>
      </g>
    </g>

    <!-- Middle Row inside Island: Password Input Field -->
    <g transform="translate(22, 80)">
      <rect width="436" height="48" rx="24" fill="url(#islandInput3)" stroke="#e0e0e0" stroke-opacity="0.34" stroke-width="1.1"/>
      <!-- Dots -->
      <g fill="#f0f0f0" fill-opacity="0.94">
        <circle cx="26" cy="24" r="3.6"/>
        <circle cx="40" cy="24" r="3.6"/>
        <circle cx="54" cy="24" r="3.6"/>
        <circle cx="68" cy="24" r="3.6"/>
        <circle cx="82" cy="24" r="3.6"/>
        <circle cx="96" cy="24" r="3.6"/>
        <circle cx="110" cy="24" r="3.6"/>
      </g>
      <rect x="123" y="14" width="1.6" height="20" rx="0.8" fill="#ffffff" fill-opacity="0.88"/>

      <!-- Eye Icon -->
      <g transform="translate(310, 16)" stroke="#f0f0f0" stroke-opacity="0.48" stroke-width="1.4" fill="none">
        <path d="M 1 8 C 3.5 3.5, 12.5 3.5, 15 8 C 12.5 12.5, 3.5 12.5, 1 8 Z"/>
        <circle cx="8" cy="8" r="2.2"/>
      </g>

      <!-- Unlock Pill Button -->
      <g transform="translate(340, 6)">
        <rect width="90" height="36" rx="18" fill="#f0f0f0" fill-opacity="0.94"/>
        <text x="45" y="22.5" text-anchor="middle" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#000000">Kilidi Aç</text>
      </g>
    </g>

    <!-- Hairline Divider inside Island -->
    <line x1="22" y1="146" x2="458" y2="146" stroke="#f0f0f0" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Bottom Action Bar inside Island: Session Controls -->
    <g transform="translate(22, 160)">
      <!-- Sleep Pill -->
      <g>
        <rect width="136" height="36" rx="18" fill="#f0f0f0" fill-opacity="0.06" stroke="#f0f0f0" stroke-opacity="0.09" stroke-width="1"/>
        <path d="M 40 13.5 A 5.2 5.2 0 1 0 42 21 A 4.2 4.2 0 1 1 40 13.5 Z" fill="none" stroke="#f0f0f0" stroke-opacity="0.8" stroke-width="1.35"/>
        <text x="56" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#f0f0f0" fill-opacity="0.8">Uyku</text>
      </g>

      <!-- Reboot Pill -->
      <g transform="translate(150, 0)">
        <rect width="136" height="36" rx="18" fill="#f0f0f0" fill-opacity="0.06" stroke="#f0f0f0" stroke-opacity="0.09" stroke-width="1"/>
        <path d="M 28.5 16 A 5 5 0 1 0 28 21.3" fill="none" stroke="#f0f0f0" stroke-opacity="0.8" stroke-width="1.35" stroke-linecap="round"/>
        <path d="M 28.8 13 V 16.4 H 25.4" fill="none" stroke="#f0f0f0" stroke-opacity="0.8" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="44" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#f0f0f0" fill-opacity="0.8">Yeniden Başlat</text>
      </g>

      <!-- Shutdown Pill -->
      <g transform="translate(300, 0)">
        <rect width="136" height="36" rx="18" fill="#ff6b6b" fill-opacity="0.11" stroke="#ff6b6b" stroke-opacity="0.25" stroke-width="1"/>
        <path d="M 41 14.5 A 5 5 0 1 0 47 14.5 M 44 12.2 V 17.5" fill="none" stroke="#ff6b6b" stroke-opacity="0.92" stroke-width="1.45" stroke-linecap="round"/>
        <text x="58" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#ff6b6b" fill-opacity="0.92">Kapat</text>
      </g>
    </g>
  </g>

  <!-- 3. Center-Middle Hero Monumental Clock (Uncluttered Focal Anchor) -->
  <g text-anchor="middle">
    <text x="960" y="458" font-family="'Inter', sans-serif" font-size="19" font-weight="500" fill="#f0f0f0" fill-opacity="0.56" letter-spacing="3.5">27 KASIM CUMA</text>
    <text x="960" y="646" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="210" font-weight="700" fill="#f0f0f0" fill-opacity="0.94" letter-spacing="-6">21:24</text>
  </g>

  <!-- 4. Lower-Center Live Activity Row: Now Playing + 3D Layered Notification Deck Preview -->
  <g transform="translate(556, 846)">
    <!-- Left Card: Now Playing Live Activity (Pure OLED Black Capsule) -->
    <g filter="url(#cardShadow3)">
      <rect width="388" height="92" rx="26" fill="#000000" fill-opacity="0.88" stroke="#f0f0f0" stroke-opacity="0.12" stroke-width="1"/>
      <!-- Album Tile -->
      <rect x="16" y="16" width="60" height="60" rx="16" fill="#202229" stroke="#f0f0f0" stroke-opacity="0.14" stroke-width="1"/>
      <circle cx="46" cy="46" r="16" fill="none" stroke="#f0f0f0" stroke-opacity="0.24" stroke-width="1.2"/>
      <circle cx="46" cy="46" r="4.5" fill="#f0f0f0" fill-opacity="0.78"/>

      <!-- Track Metadata -->
      <text x="92" y="37" font-family="'Noto Sans Display', sans-serif" font-size="14.5" font-weight="600" fill="#f0f0f0" fill-opacity="0.94">Midnight City</text>
      <text x="92" y="55" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#f0f0f0" fill-opacity="0.54">M83 · Spotify</text>

      <!-- Progress Bar -->
      <rect x="92" y="68" width="166" height="3" rx="1.5" fill="#f0f0f0" fill-opacity="0.14"/>
      <rect x="92" y="68" width="96" height="3" rx="1.5" fill="#f0f0f0" fill-opacity="0.85"/>

      <!-- Playback Controls -->
      <g transform="translate(278, 30)">
        <!-- Prev -->
        <g transform="translate(0, 8)" fill="#f0f0f0" fill-opacity="0.68">
          <path d="M 10 2 L 3 7 L 10 12 Z"/>
          <rect x="0.5" y="2.5" width="1.8" height="9" rx="0.8"/>
        </g>
        <!-- Play/Pause Circle -->
        <g transform="translate(26, 0)">
          <circle cx="16" cy="16" r="16" fill="#f0f0f0" fill-opacity="0.12"/>
          <rect x="12" y="10.5" width="2.6" height="11" rx="1" fill="#f0f0f0" fill-opacity="0.94"/>
          <rect x="17.2" y="10.5" width="2.6" height="11" rx="1" fill="#f0f0f0" fill-opacity="0.94"/>
        </g>
        <!-- Next -->
        <g transform="translate(72, 8)" fill="#f0f0f0" fill-opacity="0.68">
          <path d="M 1 2 L 8 7 L 1 12 Z"/>
          <rect x="9.5" y="2.5" width="1.8" height="9" rx="0.8"/>
        </g>
      </g>
    </g>

    <!-- Right Card: OgsShell 3D Layered Notification Cards Deck (3 Physical Depth Tiers!) -->
    <g transform="translate(420, 0)">
      <!-- Tier 3 (Bottom Peek: 82% width, +20px) -->
      <rect x="35" y="20" width="318" height="92" rx="24" fill="#0b0c10" fill-opacity="0.72" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
      <!-- Tier 2 (Middle Peek: 91% width, +10px) -->
      <rect x="17.5" y="10" width="353" height="92" rx="25" fill="#060709" fill-opacity="0.86" stroke="#f0f0f0" stroke-opacity="0.15" stroke-width="1"/>
      <!-- Tier 1 (Front Active Card: 100% width) -->
      <g filter="url(#cardShadow3)">
        <rect width="388" height="92" rx="26" fill="#000000" fill-opacity="0.96" stroke="#f0f0f0" stroke-opacity="0.18" stroke-width="1"/>
        <!-- Bell Icon Circle -->
        <circle cx="42" cy="46" r="21" fill="#f0f0f0" fill-opacity="0.08" stroke="#f0f0f0" stroke-opacity="0.12" stroke-width="1"/>
        <g transform="translate(34, 37)" stroke="#f0f0f0" stroke-opacity="0.88" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 13.5 11.5 H 2.5 C 3.8 10.2, 4.3 8.5, 4.3 6.5 A 3.7 3.7 0 0 1 11.7 6.5 C 11.7 8.5, 12.2 10.2, 13.5 11.5 Z"/>
          <path d="M 6.5 14 A 1.7 1.7 0 0 0 9.5 14"/>
        </g>

        <!-- Notification Content -->
        <text x="78" y="38" font-family="'Noto Sans Display', sans-serif" font-size="14" font-weight="600" fill="#f0f0f0" fill-opacity="0.94">Discord</text>
        <text x="78" y="57" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#f0f0f0" fill-opacity="0.56">Kilit açıldığında içerik gösterilir</text>
        <text x="78" y="74" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#f0f0f0" fill-opacity="0.36">2 dakika önce</text>

        <!-- Deck Counter Badge (+2 Deste) -->
        <rect x="304" y="22" width="64" height="22" rx="11" fill="#f0f0f0" fill-opacity="0.10"/>
        <text x="336" y="36.5" text-anchor="middle" font-family="'Noto Sans Display', sans-serif" font-size="11" font-weight="600" fill="#f0f0f0" fill-opacity="0.82">+2 Deste</text>
      </g>
    </g>
  </g>

  <!-- 5. Screen Rounded Corners (14px Pure Black Hardware Cutouts) -->
  <g fill="#000000">
    <path d="M 0 0 H 14 A 14 14 0 0 0 0 14 Z"/>
    <path d="M 1920 0 H 1906 A 14 14 0 0 1 1920 14 Z"/>
    <path d="M 0 1080 H 14 A 14 14 0 0 1 0 1066 Z"/>
    <path d="M 1920 1080 H 1906 A 14 14 0 0 0 1920 1066 Z"/>
  </g>
</svg>
