<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Atmospheric Monochrome Wallpaper Gradients -->
    <linearGradient id="bgSky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#0e0f12"/>
      <stop offset="45%" stop-color="#17191e"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>

    <radialGradient id="ambientGlowTop" cx="50%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#3a3f4a" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#1e2128" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0c0e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientGlowLow" cx="72%" cy="82%" r="48%">
      <stop offset="0%" stop-color="#2e323c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0b0c0e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23262e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0e1014" stop-opacity="0.88"/>
    </linearGradient>

    <linearGradient id="ridgeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17191f" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#090a0c" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Frosted Glass Surface Gradients -->
    <linearGradient id="glassPill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#f0f0f0" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="glassSubtle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f0f0f0" stop-opacity="0.035"/>
    </linearGradient>

    <!-- Shadows matching OgsShell config.json -->
    <filter id="notchShadow" x="-15%" y="-10%" width="130%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.62"/>
    </filter>

    <filter id="glassShadow" x="-15%" y="-25%" width="130%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.52"/>
    </filter>

    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <linearGradient id="clockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#d4d6dc" stop-opacity="0.86"/>
    </linearGradient>

    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="28%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.48"/>
    </linearGradient>
  </defs>

  <!-- 1. Atmospheric Blurred Monochrome Wallpaper -->
  <rect width="1920" height="1080" fill="url(#bgSky)"/>
  <rect width="1920" height="1080" fill="url(#ambientGlowTop)"/>
  <rect width="1920" height="1080" fill="url(#ambientGlowLow)"/>

  <!-- Soft Sculpted Monochrome Horizon Layers (Artifact-free smooth gradients) -->
  <g>
    <path d="M0 740 C 320 560, 660 620, 1020 540 C 1380 460, 1660 550, 1920 480 L 1920 1080 L 0 1080 Z" fill="url(#ridgeBack)" opacity="0.72"/>
    <path d="M0 840 C 380 710, 760 800, 1200 710 C 1540 640, 1740 700, 1920 655 L 1920 1080 L 0 1080 Z" fill="url(#ridgeFront)" opacity="0.88"/>
  </g>
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- 2. OgsShell Top Dynamic Notch (Pure OLED Black #000000 with G2 Bezier Ears) -->
  <!-- Total width: 290 + 2*8 = 306px, centered at x=960 -> x=807..1113, height=34px -->
  <g filter="url(#notchShadow)">
    <path d="M 803 0
             C 808 0, 811 6, 811 15
             L 811 16
             A 18 18 0 0 0 829 34
             L 1091 34
             A 18 18 0 0 0 1109 16
             L 1109 15
             C 1109 6, 1112 0, 1117 0
             Z"
          fill="#000000"/>
    <!-- Subtle Inner Hairline Edge -->
    <path d="M 811.5 16 A 17.5 17.5 0 0 0 829 33.5 L 1091 33.5 A 17.5 17.5 0 0 0 1108.5 16"
          fill="none" stroke="#f0f0f0" stroke-opacity="0.08" stroke-width="1"/>
  </g>

  <!-- Top Notch Contents: Lock Icon | TR | Wi-Fi | BT | Battery -->
  <g transform="translate(833, 9)">
    <!-- Lock Icon -->
    <g stroke="#f0f0f0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
      <rect x="2" y="7" width="10" height="7.5" rx="2"/>
      <path d="M 4.5 7 V 4.8 A 2.5 2.5 0 0 1 9.5 4.8 V 7"/>
    </g>
    <text x="20" y="12.5" font-family="'Inter', 'Noto Sans', sans-serif" font-size="11.5" font-weight="500" fill="#f0f0f0" fill-opacity="0.72" letter-spacing="0.4">Kilitli</text>

    <!-- Hairline Separator -->
    <line x1="64" y1="2.5" x2="64" y2="14" stroke="#f0f0f0" stroke-opacity="0.16" stroke-width="1"/>

    <!-- Keyboard Layout Badge -->
    <rect x="75" y="0.5" width="26" height="16" rx="5" fill="#f0f0f0" fill-opacity="0.10"/>
    <text x="88" y="12" text-anchor="middle" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#f0f0f0" fill-opacity="0.88">TR</text>

    <!-- Wi-Fi Icon -->
    <g transform="translate(116, 2)" stroke="#f0f0f0" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.86">
      <path d="M 1 4.5 A 9.5 9.5 0 0 1 14 4.5"/>
      <path d="M 3.6 7.3 A 5.8 5.8 0 0 1 11.4 7.3"/>
      <circle cx="7.5" cy="10.5" r="1.1" fill="#f0f0f0" stroke="none"/>
    </g>

    <!-- Bluetooth Icon -->
    <g transform="translate(143, 1.5)" stroke="#f0f0f0" stroke-width="1.35" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.78">
      <path d="M 4.5 1 L 4.5 12.5 L 8.5 9.5 L 1.5 4 M 1.5 9.5 L 8.5 4 L 4.5 1"/>
    </g>

    <!-- Battery Indicator -->
    <g transform="translate(166, 2.5)">
      <rect x="0" y="1" width="21" height="10.5" rx="3" fill="none" stroke="#f0f0f0" stroke-opacity="0.72" stroke-width="1.2"/>
      <rect x="2" y="3" width="14" height="6.5" rx="1.4" fill="#f0f0f0" fill-opacity="0.88"/>
      <rect x="22" y="4.2" width="1.8" height="4" rx="0.9" fill="#f0f0f0" fill-opacity="0.6"/>
      <text x="29" y="10" font-family="'Noto Sans Display', sans-serif" font-size="11" font-weight="600" fill="#f0f0f0" fill-opacity="0.85">84%</text>
    </g>
  </g>

  <!-- 3. Center Hero Typography (Date + Monumental Clock) -->
  <g text-anchor="middle">
    <!-- Subtle Date -->
    <text x="960" y="248" font-family="'Inter', 'Noto Sans', sans-serif" font-size="22" font-weight="500" fill="#f0f0f0" fill-opacity="0.68" letter-spacing="1.6">27 KASIM CUMA</text>

    <!-- Monumental Display Clock -->
    <text x="960" y="404" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="172" font-weight="700" fill="url(#clockGrad)" letter-spacing="-4">21:24</text>

    <!-- Subtle Status Metadata Chip (Alarm + Notifications) -->
    <g transform="translate(838, 434)">
      <rect width="244" height="32" rx="16" fill="#000000" fill-opacity="0.42" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
      <!-- Alarm Bell Vector -->
      <g transform="translate(18, 9)" stroke="#f0f0f0" stroke-opacity="0.72" stroke-width="1.35" fill="none" stroke-linecap="round">
        <circle cx="7" cy="7.5" r="5.2"/>
        <path d="M 7 4.8 V 7.6 L 9 8.8"/>
        <path d="M 2.5 2.5 L 4.3 1.2 M 11.5 2.5 L 9.7 1.2"/>
      </g>
      <text x="38" y="20.5" text-anchor="start" font-family="'Inter', sans-serif" font-size="12.5" font-weight="500" fill="#f0f0f0" fill-opacity="0.78">07:30</text>
      <circle cx="88" cy="16" r="2" fill="#f0f0f0" fill-opacity="0.32"/>
      <!-- Notification Dot + Label -->
      <circle cx="104" cy="16" r="3" fill="#e0e0e0" fill-opacity="0.88"/>
      <text x="115" y="20.5" text-anchor="start" font-family="'Inter', sans-serif" font-size="12.5" font-weight="500" fill="#f0f0f0" fill-opacity="0.78">2 yeni bildirim</text>
    </g>
  </g>

  <!-- 4. Center-Lower Authentication Stack -->
  <g transform="translate(960, 690)">
    <!-- Minimalist User Avatar Ring -->
    <g transform="translate(0, -64)">
      <circle cx="0" cy="0" r="34" fill="#000000" fill-opacity="0.58" stroke="#f0f0f0" stroke-opacity="0.18" stroke-width="1.2"/>
      <!-- Clean Geometric User Silhouette -->
      <circle cx="0" cy="-6" r="9.5" fill="none" stroke="#f0f0f0" stroke-opacity="0.85" stroke-width="1.8"/>
      <path d="M -16 17 C -16 7.5, -8.5 4, 0 4 C 8.5 4, 16 7.5, 16 17" fill="none" stroke="#f0f0f0" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Username -->
    <text x="0" y="-8" text-anchor="middle" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="17" font-weight="600" fill="#f0f0f0" fill-opacity="0.92" letter-spacing="0.4">excalibur</text>

    <!-- Frosted Glass Password Input Capsule (340 x 50) -->
    <g transform="translate(-170, 14)" filter="url(#glassShadow)">
      <rect width="340" height="50" rx="25" fill="#000000" fill-opacity="0.68"/>
      <rect width="340" height="50" rx="25" fill="url(#glassPill)" stroke="#f0f0f0" stroke-opacity="0.24" stroke-width="1"/>

      <!-- Password Dots -->
      <g fill="#f0f0f0" fill-opacity="0.92">
        <circle cx="32" cy="25" r="3.8"/>
        <circle cx="48" cy="25" r="3.8"/>
        <circle cx="64" cy="25" r="3.8"/>
        <circle cx="80" cy="25" r="3.8"/>
        <circle cx="96" cy="25" r="3.8"/>
        <circle cx="112" cy="25" r="3.8"/>
        <circle cx="128" cy="25" r="3.8"/>
        <circle cx="144" cy="25" r="3.8"/>
      </g>
      <!-- Active Cursor Caret -->
      <rect x="157" y="15" width="1.6" height="20" rx="0.8" fill="#ffffff" fill-opacity="0.85"/>

      <!-- Eye Icon (Show/Hide Password) -->
      <g transform="translate(264, 17)" stroke="#f0f0f0" stroke-opacity="0.5" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 1 8 C 3.5 3.5, 12.5 3.5, 15 8 C 12.5 12.5, 3.5 12.5, 1 8 Z"/>
        <circle cx="8" cy="8" r="2.2"/>
      </g>

      <!-- Circular Submit Button -->
      <g transform="translate(296, 6)">
        <circle cx="19" cy="19" r="19" fill="#f0f0f0" fill-opacity="0.92"/>
        <path d="M 14.5 19 H 23.5 M 19.5 14.5 L 24 19 L 19.5 23.5" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Helper Hint Line -->
    <text x="0" y="90" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#f0f0f0" fill-opacity="0.42" letter-spacing="0.3">Kilidi açmak için parolanızı girin</text>
  </g>

  <!-- 5. Bottom-Left Compact Now Playing Pill (Pure OLED Black Silhouette) -->
  <g transform="translate(44, 980)" filter="url(#glassShadow)">
    <rect width="296" height="58" rx="29" fill="#000000" fill-opacity="0.84" stroke="#f0f0f0" stroke-opacity="0.11" stroke-width="1"/>
    <!-- Minimal Album Art Tile -->
    <rect x="9" y="9" width="40" height="40" rx="20" fill="#23252c" stroke="#f0f0f0" stroke-opacity="0.14" stroke-width="1"/>
    <circle cx="29" cy="29" r="11" fill="none" stroke="#f0f0f0" stroke-opacity="0.28" stroke-width="1"/>
    <circle cx="29" cy="29" r="3.5" fill="#f0f0f0" fill-opacity="0.72"/>

    <!-- Track Title & Artist -->
    <text x="61" y="26" font-family="'Noto Sans Display', 'Inter', sans-serif" font-size="13" font-weight="600" fill="#f0f0f0" fill-opacity="0.92">Midnight City</text>
    <text x="61" y="42" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#f0f0f0" fill-opacity="0.52">M83 · Spotify</text>

    <!-- Media Controls (Pause + Next) -->
    <g transform="translate(230, 17)">
      <circle cx="12" cy="12" r="14" fill="#f0f0f0" fill-opacity="0.09"/>
      <rect x="8.5" y="7" width="2.4" height="10" rx="1" fill="#f0f0f0" fill-opacity="0.9"/>
      <rect x="13.2" y="7" width="2.4" height="10" rx="1" fill="#f0f0f0" fill-opacity="0.9"/>
    </g>
    <g transform="translate(264, 21)" fill="#f0f0f0" fill-opacity="0.72">
      <path d="M 1 2 L 8 7 L 1 12 Z"/>
      <rect x="9.5" y="2.5" width="1.8" height="9" rx="0.8"/>
    </g>
  </g>

  <!-- 6. Bottom-Right Circular Session Controls (Matching PowerOverlay.qml) -->
  <g transform="translate(1724, 987)">
    <!-- Suspend -->
    <g>
      <circle cx="22" cy="22" r="22" fill="#000000" fill-opacity="0.62" stroke="#f0f0f0" stroke-opacity="0.12" stroke-width="1"/>
      <path d="M 25.5 16.5 A 6.8 6.8 0 1 0 28 26.2 A 5.4 5.4 0 1 1 25.5 16.5 Z" fill="none" stroke="#f0f0f0" stroke-opacity="0.78" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <!-- Reboot -->
    <g transform="translate(56, 0)">
      <circle cx="22" cy="22" r="22" fill="#000000" fill-opacity="0.62" stroke="#f0f0f0" stroke-opacity="0.12" stroke-width="1"/>
      <path d="M 27.5 19.5 A 6.2 6.2 0 1 0 26.8 26" fill="none" stroke="#f0f0f0" stroke-opacity="0.78" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 27.8 15.5 V 19.8 H 23.5" fill="none" stroke="#f0f0f0" stroke-opacity="0.78" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Poweroff -->
    <g transform="translate(112, 0)">
      <circle cx="22" cy="22" r="22" fill="#000000" fill-opacity="0.62" stroke="#ff6b6b" stroke-opacity="0.28" stroke-width="1"/>
      <path d="M 18.2 17.4 A 6.4 6.4 0 1 0 25.8 17.4 M 22 14.2 V 21" fill="none" stroke="#ff6b6b" stroke-opacity="0.88" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 7. OgsShell Screen Rounded Corners (14px Pure Black Hardware Cutouts) -->
  <g fill="#000000">
    <!-- Top-Left -->
    <path d="M 0 0 H 14 A 14 14 0 0 0 0 14 Z"/>
    <!-- Top-Right -->
    <path d="M 1920 0 H 1906 A 14 14 0 0 1 1920 14 Z"/>
    <!-- Bottom-Left -->
    <path d="M 0 1080 H 14 A 14 14 0 0 1 0 1066 Z"/>
    <!-- Bottom-Right -->
    <path d="M 1920 1080 H 1906 A 14 14 0 0 0 1920 1066 Z"/>
  </g>
</svg>
