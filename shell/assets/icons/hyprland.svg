<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b" />
      <stop offset="100%" stop-color="#0c0e12" />
    </linearGradient>
    
    <!-- Hyprland Cyan-Blue Left Facet Gradient -->
    <linearGradient id="hyprCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Hyprland Teal-Mint Right Facet Gradient -->
    <linearGradient id="hyprTealMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b" />
      <stop offset="100%" stop-color="#38f9d7" />
    </linearGradient>

    <!-- Inner Core Fold Gradient -->
    <linearGradient id="hyprCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6fb" />
      <stop offset="100%" stop-color="#005bea" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background OLED Squircle Frame -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="1.2" />

  <!-- Hyprland Stylized Geometric Chevron / Logo Group -->
  <g filter="url(#softGlow)" transform="translate(0, 1)">
    <!-- Left Wing / Triangle Facet -->
    <path d="M32 13 L15 47 L28 47 L37 28 Z" fill="url(#hyprCyanBlue)" opacity="0.95" />

    <!-- Right Wing / Triangle Facet -->
    <path d="M32 13 L49 47 L36 47 L27 28 Z" fill="url(#hyprTealMint)" opacity="0.95" />

    <!-- Center Fold / Bottom Accent Prism -->
    <path d="M28 47 L32 38 L36 47 Z" fill="url(#hyprCore)" opacity="0.85" />
    
    <!-- Top Apex Highlight Pip -->
    <circle cx="32" cy="14" r="2" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
