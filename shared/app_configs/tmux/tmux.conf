# ==============================================================================
#  OGSSHELL-QS DYNAMIC TMUX CONFIGURATION
#  Apple Dynamic Island & Notch Aesthetic | Dual-Capsule Status Bar | Zero Plugins
# ==============================================================================

# --- Prefix Tuşu Yapılandırması (Ctrl + Space) ---
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- Terminal ve Renk Desteği (TrueColor & Kitty / Wayland Entegrasyonu) ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

# --- Genel Kullanılabilirlik & Tepkisellik ---
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -g history-limit 50000

# --- Numaralandırma ve Otomatik Sıralama (1-Tabanlı) ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Vi Kopyalama Modu & Wayland Panosu (wl-copy) Entegrasyonu ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"

# --- Panel ve Pencere Yönetimi (Bulunulan Dizini Koru) ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim benzeri panel yönlendirme (h, j, k, l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Panel boyutlandırma kısayolları (Ctrl tuşuyla tekrarlanabilir)
bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

# Pencereler arası hızlı geçiş (Shift + Alt + h/l, Prefix tuşuna basmadan)
bind -n M-H previous-window
bind -n M-L next-window

# Yapılandırmayı canlı anında yeniden yükle
bind r source-file ~/.tmux.conf \; display-message "✨ OgsShell Tmux Konfigürasyonu Başarıyla Yenilendi!"

# ==============================================================================
#  OGSSHELL DİNAMİK TEMA MOTORU ENTEGRASYONU
# ==============================================================================

# Varsayılan Değişkenler (Tema dosyası henüz yüklenmemişse güvenli fallback)
set -ogq @minimal-tmux-fg "#191724"
set -ogq @minimal-tmux-bg "#EBBCBA"
set -ogq @minimal-tmux-prefix-fg "#191724"
set -ogq @minimal-tmux-prefix-bg "#F6C177"

# OgsShell backend servisinin (core/services/theme/adapters/tmux.go) yazdığı aktif temayı dahil et
if-shell '[ -f ~/.config/tmux/current-theme.conf ]' 'source-file ~/.config/tmux/current-theme.conf'
if-shell '[ ! -f ~/.config/tmux/current-theme.conf ] && [ -f ~/.tmux/current-theme.conf ]' 'source-file ~/.tmux/current-theme.conf'

# Panel kenarlık çizgisi stili
set -g pane-border-lines single

# ==============================================================================
#  OGSSHELL ÇİFT KAPSÜL (DUAL-CAPSULE) DURUM ÇUBUĞU
# ==============================================================================

set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-style "bg=default"
set -g status-justify absolute-centre

set -g status-left-length 150
set -g status-right-length 150

# --- SOL KAPSÜL: Oturum Adı & Dinamik Prefix Uyarısı ---
# Normal modda aktif tema renginde parlar; Prefix tuşuna (Ctrl+Space) basıldığında canlı uyarı rengine bürünür.
set -g status-left "#{?client_prefix,#[fg=#{@minimal-tmux-prefix-bg}#,bg=default]#[fg=#{@minimal-tmux-prefix-fg}#,bg=#{@minimal-tmux-prefix-bg}#,bold] 󰒋 #S #[fg=#{@minimal-tmux-prefix-bg}#,bg=default],#[fg=#{@minimal-tmux-bg}#,bg=default]#[fg=#{@minimal-tmux-fg}#,bg=#{@minimal-tmux-bg}#,bold] 󰒋 #S #[fg=#{@minimal-tmux-bg}#,bg=default]}"

# --- ORTA ALAN: Ortalı Pencere Kapsülleri ---
set -g window-status-separator "  "

# Aktif Pencere: Yüzen renkli ada/kapsül + Zoom (󰊓) rozeti
set -g window-status-current-format "#[fg=#{@minimal-tmux-bg},bg=default]#[fg=#{@minimal-tmux-fg},bg=#{@minimal-tmux-bg},bold]#I:#W#{?window_zoomed_flag, 󰊓,}#[fg=#{@minimal-tmux-bg},bg=default]"

# İnaktif Pencere: Dikkat dağıtmayan minimalist görünüm
set -g window-status-format "#[fg=#6c7086,bg=default]#I:#W#{?window_zoomed_flag, 󰊓,}"

# --- SAĞ KAPSÜL: Akıllı Rozetler (Copy, Sync, SSH/Host, Zaman) ---
# 1. Copy Mode: Kullanıcı arama veya kopyalama moduna girdiğinde beliren altın sarısı rozet
# 2. Sync Mode: Paneller senkronize moddayken yanan kırmızı rozet
# 3. SSH / Local: Uzak sunucuya bağlanıldığında SSH rozeti, yerel terminaldeyse kullanıcı adı
# 4. Zaman Kapsülü: OgsShell Dynamic Island saatiyle eşleşen zaman hapı
set -g status-right "#{?pane_in_mode,#[fg=#F9E2AF#,bg=default]#[fg=#1E1E2E#,bg=#F9E2AF#,bold]󰆏 COPY#[fg=#F9E2AF#,bg=default] ,}#{?pane_synchronized,#[fg=#F38BA8#,bg=default]#[fg=#1E1E2E#,bg=#F38BA8#,bold]󰓦 SYNC#[fg=#F38BA8#,bg=default] ,}#{?#{||:#{m:ssh*,#{pane_current_command}},#{!=:#{SSH_CLIENT},}},#[fg=#89B4FA#,bg=default]#[fg=#1E1E2E#,bg=#89B4FA#,bold]󰒍 SSH#[fg=#89B4FA#,bg=default] ,#[fg=#45475A#,bg=default]#[fg=#CDD6F4#,bg=#45475A#,bold]󰌢 #(whoami)#[fg=#45475A#,bg=default] }#[fg=#{@minimal-tmux-bg}#,bg=default]#[fg=#{@minimal-tmux-fg}#,bg=#{@minimal-tmux-bg}#,bold]󱑎 %H:%M#[fg=#{@minimal-tmux-bg}#,bg=default]"
